name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            python_arch: x64
            built_name: Arena-Desktop.exe
            artifact_name: Arena-Desktop-windows-x64
            release_name: Arena-Desktop.exe
          - arch: arm64
            runner: windows-11-arm
            python_arch: arm64
            built_name: Arena-Desktop-arm64.exe
            artifact_name: Arena-Desktop-windows-arm64
            release_name: Arena-Desktop-arm64.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python_arch }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7" "pytest>=8"

      - name: Show build architecture
        shell: pwsh
        run: |
          python -c "import platform, struct, sys; print(sys.executable); print(platform.platform()); print(platform.machine(), struct.calcsize('P') * 8)"

      - name: Run non-browser tests in timed groups
        shell: pwsh
        run: python scripts/run_test_groups.py

      - name: Build one-file EXE
        shell: pwsh
        env:
          ARENA_TARGET_ARCH: ${{ matrix.arch }}
        run: python -m PyInstaller --clean --noconfirm arena-cli.spec

      - name: Verify PE architecture and name artifact
        shell: pwsh
        run: |
          $built = Join-Path $PWD "dist/${{ matrix.built_name }}"
          if (-not (Test-Path -LiteralPath $built)) { throw "Built EXE not found: $built" }
          python scripts/check_pe_arch.py $built ${{ matrix.arch }}
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath $built -Destination "release/${{ matrix.release_name }}"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.release_name }}
          if-no-files-found: error
          retention-days: 30
